<html>
            <head>
                <title>Upload Database</title>
            </head>
            <body>
                <h1>Database Uploader</h1>
                <button onclick="uploadDatabase()">Upload Database</button>
                <p id="result"></p>
                <script>
                    async function uploadDatabase() {
                        const response = await fetch('/upload-db');
                        const data = await response.json();
                        const resultElement = document.getElementById('result');
                        if (data.success) {
                            resultElement.innerHTML = `Uploaded successfully! Access it <a href="${data.url}" target="_blank">here</a>`;
                        } else {
                            resultElement.innerHTML = 'Upload failed: ' + data.message;
                        }
                    }
                </script>
            </body>
        </html>
